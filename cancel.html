<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jooji Ballanta — EMIS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#26231F; --sand:#EDE4D3; --cream:#F7F4EC; --teal:#1E3A34; --clay:#A63A2C; }
  body{ margin:0; background:var(--sand); color:var(--ink); font-family:'Segoe UI', Tahoma, sans-serif; line-height:1.6; }
  .watermark{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:380px; max-width:70vw; opacity:0.06; z-index:0; pointer-events:none;
  }
  header{ position:relative; z-index:1; text-align:center; padding:16px 20px 4px; }
  header img{ max-width:100%; width:460px; height:auto; }
  main{ position:relative; z-index:1; max-width:460px; margin:30px auto 60px; padding:0 20px; }
  .card{ background:var(--cream); border-radius:10px; padding:28px; text-align:center; }
  h1{ font-size:1.3rem; color:var(--teal); margin-top:0; }
  p{ font-size:0.95rem; }
  .msg{ margin-top:16px; padding:12px 14px; border-radius:6px; font-size:0.92rem; }
  .msg.error{ background:#f6d8d2; color:#7a2a1c; }
  .msg.success{ background:#d9ecdf; color:#1c4a2c; }
</style>
</head>
<body>
<img src="jss-seal.jpg" alt="" class="watermark">
<header>
  <img src="jubaland-header.png" alt="Ministry of Education Culture and Higher Learning — Jubaland">
</header>
<main>
  <div class="card">
    <h1>Jooji Ballanta</h1>
    <p>Waxaad joojinaysaa ballanta booqashada aad qabsatay xafiiska EMIS.</p>
    <div id="result" class="msg">Fadlan sug...</div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://eqpgcpmfpimgblzazqrs.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_1N1Y3qIbLtP-l0uWJo1DOQ_luS-XKFr';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const token = params.get('token');
  const resultEl = document.getElementById('result');

  async function cancel(){
    if (!id || !token){
      resultEl.className = 'msg error';
      resultEl.textContent = 'Xiriirkan lama aqoonsan karo.';
      return;
    }
    const { data, error } = await supabaseClient.rpc('cancel_appointment', {
      p_id: Number(id),
      p_token: token
    });
    if (error || !data || !data[0] || !data[0].success){
      resultEl.className = 'msg error';
      resultEl.textContent = (data && data[0] && data[0].message) || 'Wax baa qaldamay.';
      return;
    }
    resultEl.className = 'msg success';
    resultEl.textContent = data[0].message;
  }
  cancel();
</script>
</body>
</html>
